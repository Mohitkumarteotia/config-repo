# Eureka Server configuration
# Server port and application name
server.port=8761
spring.application.name=eureka-server

# Eureka client settings (server should not register with itself and should not fetch registry)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Instance settings (optional - set hostname or prefer ip address)
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Eureka server tuning
# Frequency to check for expired instances (ms)
eureka.server.eviction-interval-timer-in-ms=60000
# How often to update the response cache (ms)
eureka.server.response-cache-update-interval-ms=5000
# Disable peer-awareness unless you run a cluster
eureka.server.peer-awareness.enabled=false

# Disable self-preservation for development/testing (use with caution in production)
eureka.server.enable-self-preservation=false

# Logging
logging.level.com.netflix.eureka=INFO

# Actuator (management) settings
# Expose actuator endpoints on the same port under /actuator
management.endpoints.web.base-path=/actuator
# Only expose the endpoints you need. Use '*' to expose all (not recommended in prod)
management.endpoints.web.exposure.include=health,info,metrics,env,beans,conditions,loggers,prometheus
# Always show health details (use `when-authorized` or `never` in prod for security)
management.endpoint.health.show-details=always

# Optional: enable basic security user for actuator (replace with secure credentials or integrate with your auth)
#spring.security.user.name=admin
#spring.security.user.password=change-me
